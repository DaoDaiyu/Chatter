name: Build Android APK

# Builds the debug APK on GitHub-hosted runners, which ship the full Android
# SDK (compileSdk 35 / build-tools) that this project needs — the SDK isn't
# downloadable in every environment. Every push produces a downloadable APK,
# both as a workflow artifact and attached to a GitHub Release.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the Release with the APK attached

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # vite build only — the strict `npm run build` also runs vue-tsc, which
      # surfaces pre-existing type errors in this source-level port and isn't
      # required to produce a runnable bundle. See README "Known gaps".
      - name: Build web assets
        run: npm run build:web

      - name: Sync Capacitor (copy web assets + plugins into android/)
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Horizon debug APK (build ${{ github.run_number }})
          body: |
            Automated debug build of the Horizon Android app.
            Commit: ${{ github.sha }}

            Install the attached `app-debug.apk` on an Android device
            (enable "Install unknown apps" for your browser/file manager).
            This is a debug build — unoptimized and debug-signed.
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
