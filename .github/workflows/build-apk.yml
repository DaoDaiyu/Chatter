name: Build Impression Lab APK

on:
  push:
    branches: ["claude/rivet-voice-app-android-2iqt11"]
    paths:
      - "rivet-voice-app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release APK
        working-directory: rivet-voice-app
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImpressionLab-apk
          path: rivet-voice-app/app/build/outputs/apk/release/app-release.apk

      - name: Commit APK back to branch
        run: |
          mkdir -p apk
          cp rivet-voice-app/app/build/outputs/apk/release/app-release.apk apk/ImpressionLab.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/ImpressionLab.apk
          git commit -m "Add built Impression Lab APK [skip ci]" || echo "APK unchanged"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
